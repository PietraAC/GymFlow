name: gymflow

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?configure POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: postgres
      GYM_DB_PASSWORD: ${GYM_DB_PASSWORD:?configure GYM_DB_PASSWORD in .env}
      WORKOUT_DB_PASSWORD: ${WORKOUT_DB_PASSWORD:?configure WORKOUT_DB_PASSWORD in .env}
      ASSISTANT_DB_PASSWORD: ${ASSISTANT_DB_PASSWORD:?configure ASSISTANT_DB_PASSWORD in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?configure KEYCLOAK_DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak_service
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?configure KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?configure KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?configure KEYCLOAK_ADMIN_PASSWORD in .env}
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - ./infra/keycloak/gymflow-realm.json:/opt/keycloak/data/import/gymflow-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:

