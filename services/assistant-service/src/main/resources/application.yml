spring:
  application:
    name: assistant-service
  profiles:
    default: local
  datasource:
    url: ${ASSISTANT_DB_URL:jdbc:postgresql://localhost:5432/assistant_db}
    username: ${ASSISTANT_DB_USERNAME:assistant_service}
    password: ${ASSISTANT_DB_PASSWORD:}
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8080/realms/gymflow}
app.security.audience: ${JWT_AUDIENCE:assistant-service}
app.clients.workout-service:
  base-url: ${WORKOUT_SERVICE_URL:http://localhost:8082}
  connect-timeout: ${WORKOUT_SERVICE_CONNECT_TIMEOUT:2s}
  read-timeout: ${WORKOUT_SERVICE_READ_TIMEOUT:4s}
app.clients.gym-service:
  base-url: ${GYM_SERVICE_URL:http://localhost:8081}
  connect-timeout: ${GYM_SERVICE_CONNECT_TIMEOUT:2s}
  read-timeout: ${GYM_SERVICE_READ_TIMEOUT:4s}
app.ai:
  provider: ${AI_PROVIDER:demo}
  model: ${AI_MODEL:gemini-3.5-flash-lite}
  api-key: ${GEMINI_API_KEY:}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  connect-timeout: ${AI_CONNECT_TIMEOUT:3s}
  read-timeout: ${AI_READ_TIMEOUT:27s}
  max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:2048}
  suggestion-ttl: ${AI_SUGGESTION_TTL:30m}
  history-limit: ${AI_HISTORY_LIMIT:8}
  candidate-limit: ${AI_CANDIDATE_LIMIT:50}
  requests-per-minute: ${AI_REQUESTS_PER_MINUTE:5}
  max-concurrency: ${AI_MAX_CONCURRENCY:2}
server.port: ${SERVER_PORT:8083}
server.error.include-stacktrace: never
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
springdoc:
  swagger-ui.path: /swagger-ui.html

