name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend
        run: ./mvnw --batch-mode verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  browser:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start complete environment
        run: bash scripts/start-ci-environment.sh
      - name: Verify maintained OpenAPI paths
        run: |
          python3 scripts/verify-openapi-paths.py docs/openapi/gym-service.yaml http://localhost:8081/v3/api-docs
          python3 scripts/verify-openapi-paths.py docs/openapi/workout-service.yaml http://localhost:8082/v3/api-docs
          python3 scripts/verify-openapi-paths.py docs/openapi/assistant-service.yaml http://localhost:8083/v3/api-docs
      - name: Verify browser flow
        working-directory: frontend
        run: npm run e2e
      - name: Show diagnostics on failure
        if: failure()
        run: |
          tail -n 200 .run/*.log || true
          docker compose logs --no-color --tail=200 || true
      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
      - name: Stop environment
        if: always()
        run: docker compose down -v
